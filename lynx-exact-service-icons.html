<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lynx exact service icons</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080d14;
      --bg-top: #0d1c34;
      --surface: #121925;
      --surface-strong: #0a111b;
      --line: #30394a;
      --line-soft: #222b39;
      --text: #f3f6fc;
      --muted: #9ca8bb;
      --blue: #2f7cf6;
      --blue-soft: #70a6ff;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% -120px, rgba(38, 94, 180, .25), transparent 390px),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, a { font: inherit; }

    .page {
      display: flex;
      width: min(100%, 780px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 30px 28px 24px;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
      font-size: 25px;
      font-weight: 760;
      letter-spacing: -.03em;
    }

    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 12px;
    }

    .hero {
      text-align: center;
      margin-bottom: 22px;
    }

    .hero h1 {
      max-width: 690px;
      margin: 0 auto 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(48px, 6vw, 70px);
      font-weight: 500;
      line-height: .88;
      letter-spacing: -.05em;
    }

    .hero p {
      margin: 0;
      color: #c4ccda;
      font-size: 17px;
      font-weight: 650;
      line-height: 1.45;
    }

    .hero .sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 560;
    }

    .result-card {
      border: 1px solid var(--line);
      border-radius: 23px;
      background: rgba(18, 25, 37, .94);
      box-shadow: 0 24px 64px rgba(0, 0, 0, .30);
      padding: 22px;
    }

    .track {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
    }

    .cover {
      position: relative;
      width: 88px;
      height: 88px;
      overflow: hidden;
      border-radius: 18px;
      background: #253047;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .10);
    }

    .cover img {
      position: absolute;
      width: 459px;
      max-width: none;
      left: -44px;
      top: -256px;
    }

    .eyebrow,
    .section-label {
      color: var(--blue-soft);
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .track h2 {
      margin: 7px 0 4px;
      font-size: 27px;
      line-height: 1.05;
      letter-spacing: -.035em;
    }

    .track p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
    }

    .section-label {
      display: block;
      margin: 0 0 10px 2px;
      color: #9ba7ba;
    }

    .destinations {
      display: grid;
      gap: 10px;
    }

    .destination {
      display: grid;
      min-height: 68px;
      grid-template-columns: 42px minmax(0, 1fr) auto 22px;
      align-items: center;
      gap: 14px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface-strong);
      padding: 11px 15px;
      color: var(--text);
      text-decoration: none;
      transition: border-color .16s ease, background-color .16s ease;
    }

    .destination:hover,
    .destination:focus-visible {
      border-color: var(--blue-soft);
      background: #0d1623;
      outline: none;
    }

    .service-icon {
      display: block;
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .service-icon.spotify { padding: 1px; }

    .service-name {
      min-width: 0;
      font-size: 20px;
      font-weight: 760;
      letter-spacing: -.025em;
    }

    .match-state {
      color: var(--muted);
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 760;
      letter-spacing: .04em;
      white-space: nowrap;
    }

    .arrow {
      color: #a8b3c6;
      font-size: 27px;
      line-height: 1;
      transform: translateY(-1px);
    }

    .hint {
      margin: 14px 4px 18px;
      color: #8995a9;
      font-size: 13px;
      line-height: 1.45;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    .action {
      min-height: 56px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: transparent;
      color: var(--text);
      font-size: 17px;
      font-weight: 760;
    }

    .action.primary {
      margin-top: 14px;
      border-color: var(--blue);
      background: var(--blue);
      color: #081120;
    }

    .secondary-links {
      display: flex;
      justify-content: center;
      gap: 22px;
      margin-top: 18px;
    }

    .secondary-links a {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      text-underline-offset: 4px;
    }

    .footer-note {
      display: flex;
      width: 100%;
      min-height: 0;
      flex: none;
      align-items: center;
      justify-content: center;
      margin-top: auto;
      padding-top: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .footer-link {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: 650;
      text-decoration: underline;
      text-decoration-color: var(--line);
      text-underline-offset: 4px;
    }

    .footer-link:hover,
    .footer-link:focus-visible {
      color: var(--text);
      outline: none;
    }

    @media (max-width: 560px) {
      .page {
        padding: 18px 14px 18px;
      }

      .brand {
        margin-bottom: 10px;
        font-size: 20px;
      }

      .brand img { width: 34px; height: 34px; border-radius: 10px; }

      .hero { margin-bottom: 16px; }

      .hero h1 {
        font-size: 42px;
        line-height: .9;
        margin-bottom: 10px;
      }

      .hero p { font-size: 14px; }
      .hero .sub { font-size: 13px; }

      .result-card {
        border-radius: 19px;
        padding: 16px;
      }

      .track {
        grid-template-columns: 68px minmax(0, 1fr);
        gap: 13px;
        margin-bottom: 17px;
      }

      .cover { width: 68px; height: 68px; border-radius: 14px; }
      .cover img { width: 355px; left: -34px; top: -198px; }

      .eyebrow { font-size: 10px; }
      .track h2 { margin-top: 5px; font-size: 22px; }
      .track p { font-size: 15px; }
      .section-label { font-size: 10px; }

      .destination {
        min-height: 60px;
        grid-template-columns: 36px minmax(0, 1fr) auto 18px;
        gap: 10px;
        border-radius: 13px;
        padding: 9px 11px;
      }

      .service-icon { width: 34px; height: 34px; }
      .service-name { font-size: 17px; }
      .match-state { font-size: 10px; }
      .arrow { font-size: 23px; }
      .hint { margin: 11px 3px 14px; font-size: 11px; }
      .action { min-height: 50px; font-size: 15px; }
      .secondary-links { margin-top: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
