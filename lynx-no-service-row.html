<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090d14" />
    <meta name="description" content="Lynx landing presentation without the service-logo row." />
    <title>Lynx, no service-logo row</title>
    <link rel="icon" type="image/svg+xml" href="https://lynx.stream/icon.svg?v=3" />
    <link rel="stylesheet" href="https://lynx.stream/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#converter">Skip to converter</a>
    <div class="glow" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="#" aria-label="Lynx home">
        <span class="brand-mark" aria-hidden="true">
          <img
            src="https://lynx.stream/icon.svg?v=3"
            alt=""
            width="80"
            height="80"
          />
        </span>
        <span class="brand-name">Lynx</span>
      </a>
    </header>

    <main>
      <h1>Share the song,<br />not the service</h1>
      <p class="intro intro-lead">
        Paste a Spotify or Apple Music track or album
      </p>
      <p class="intro intro-tail">Lynx finds it on the other service</p>

      <section
        id="converter"
        class="converter"
        aria-label="Convert a track or album link"
      >
        <form id="convert-form" novalidate>
          <label class="sr-only" for="track-link"
            >Spotify or Apple Music track or album link</label
          >
          <div class="input-shell">
            <svg class="link-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path
                d="M10.5 13.5 13.5 10.5M8.2 15.8l-1.3 1.3a3.8 3.8 0 0 1-5.4-5.4l3.4-3.4a3.8 3.8 0 0 1 5.4 0M15.8 8.2l1.3-1.3a3.8 3.8 0 0 1 5.4 5.4l-3.4 3.4a3.8 3.8 0 0 1-5.4 0"
              />
            </svg>
            <input
              id="track-link"
              name="track-link"
              type="url"
              inputmode="url"
              autocomplete="off"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              placeholder="Paste a track or album link…"
            />
            <button class="paste-button" type="button">Paste</button>
          </div>
          <button class="primary-button" type="button">
            <span class="button-label">Find the other link</span>
            <svg class="external-icon" aria-hidden="true" viewBox="0 0 20 20">
              <path d="M6 14 14 6M8 6h6v6" />
            </svg>
          </button>
        </form>
      </section>

      <p class="footer-note">
        <span class="footer-credits">
          <span class="credit">By Maksim Zeidler</span>
          <span class="made-with"
            >Made with
            <span class="thinkpool-wordmark"
              ><span class="thinkpool-think">think</span
              ><span class="thinkpool-pool">pool</span></span
            ></span
          >
        </span>
      </p>
    </main>
  </body>
</html>
