<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0B0D0E" />
  <meta name="description" content="Links to projects by Maksim Zeidler." />
  <meta property="og:title" content="Maksim Zeidler" />
  <meta property="og:description" content="A portfolio of tools built around my personal needs" />
  <title>Maksim Zeidler · YapTap portfolio mockup</title>
  <style>
    :root {
      --color-bg: hsl(212 13% 5%);
      --color-raised: hsl(212 11% 8%);
      --color-surface: hsl(212 10% 10%);
      --color-float: hsl(212 9% 13%);
      --color-line: hsl(212 7% 21%);
      --color-line-strong: hsl(212 7% 28%);
      --color-ink: hsl(212 14% 95%);
      --color-ink-soft: hsl(212 14% 86%);
      --color-muted: hsl(212 14% 78%);
      --color-faint: hsl(212 12% 62%);
      --color-pool: hsl(217 85% 62%);
      --color-pool-hi: hsl(217 85% 70%);
      --color-pool-soft: hsl(212 30% 18%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      color: var(--color-ink);
      background: var(--color-bg);
      font-family: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
      font-weight: 500;
    }
    main { width: min(100%, 480px); }
    .avatar {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      margin-bottom: 22px;
      border-radius: 50%;
      color: white;
      background: #171717;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    h1 {
      margin: 0;
      text-align: center;
      font-size: 34px;
      line-height: 1;
      letter-spacing: -.045em;
    }
    .intro {
      margin: 8px 0 12px;
      text-align: center;
      color: var(--color-muted);
      font-size: 17px;
    }
    .links { display: grid; gap: 12px; }
    .link {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 18px;
      border: 1px solid var(--color-line);
      border-radius: 14px;
      color: inherit;
      background: #111416;
      text-decoration: none;
      transition: border-color .15s ease, transform .15s ease;
    }
    a.link:hover { border-color: var(--color-pool); transform: translateY(-2px); }
    .name { display: block; margin-bottom: 4px; font-weight: 750; }
    .detail { color: var(--color-faint); font-size: 14px; }
    .arrow { font-size: 20px; }
    .app-logo {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      overflow: hidden;
      border-radius: 9px;
    }
    .app-logo img,
    .app-logo svg { width: 100%; height: 100%; display: block; object-fit: cover; }
    .repstate-logo {
      isolation: isolate;
      background: linear-gradient(145deg, #1a3c70 0%, #091426 60%, #050812 100%);
    }
    .repstate-logo img {
      filter: grayscale(1) contrast(1.08);
      mix-blend-mode: screen;
    }
    @media (max-width: 480px) {
      body { place-items: start center; padding-top: 56px; }
      h1 { font-size: 32px; }
      .intro { font-size: clamp(11.5px, 3.6vw, 17px); white-space: nowrap; }
      .link { min-height: 72px; }
    }
    @media (prefers-reduced-motion: reduce) { .link { transition: none; } }
  
    .inspection {position:fixed;bottom:12px;right:12px;z-index:10;display:flex;gap:8px;align-items:center;min-height:44px;padding:0 12px;border:1px solid var(--color-line);border-radius:10px;background:var(--color-raised);color:var(--color-faint);font-size:12px;}
    .inspection input {accent-color:#438cf8;width:16px;height:16px;}
    body:has(#guides:checked) .link {outline:1px dashed #79dfff;outline-offset:2px;position:relative;}
    body:has(#guides:checked) .link::after {content:"";position:absolute;left:18px;right:18px;top:50%;border-top:1px dashed #79dfff80;pointer-events:none;}
    body:has(#guides:checked) .app-logo {outline:1px dashed #79dfff;outline-offset:2px;}
    body:has(#guides:checked) main {outline:1px dashed #79dfff80;}
  </style>
</head>
