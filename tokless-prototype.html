<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#090909" />
<title>SlopStream · @vnthhollow</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #090909;
    --surface: #111111;
    --line: rgba(255,255,255,.12);
    --ink: #f5f5f0;
    --muted: #92928b;
    --signal: #d8ff45;
    --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 38%, rgba(216,255,69,.055), transparent 33rem),
      var(--bg);
    color: var(--ink);
    font-family: var(--sans);
  }

  button, a { font: inherit; }

  .topbar {
    position: relative;
    z-index: 2;
    height: 58px;
    padding: 0 18px;
    border-bottom: 1px solid var(--line);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    background: rgba(9,9,9,.88);
    backdrop-filter: blur(18px);
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    width: fit-content;
    color: var(--ink);
    text-decoration: none;
    font-size: 16px;
    font-weight: 740;
    letter-spacing: -.035em;
  }

  .mark {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--signal);
    position: relative;
    box-shadow: 0 0 28px rgba(216,255,69,.22);
  }

  .mark::after {
    content: "";
    position: absolute;
    inset: 5px;
    border: 2px solid #090909;
    border-left-color: transparent;
    border-radius: 50%;
    transform: rotate(-28deg);
  }

  .source {
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 7px;
    font-size: 13px;
  }

  .source strong {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 600;
  }

  .source span {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .actions {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .action {
    min-width: 74px;
    min-height: 36px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #161616;
    color: var(--ink);
    cursor: pointer;
    font-size: 12px;
    font-weight: 650;
  }

  .action:hover { border-color: rgba(216,255,69,.5); }
  .action:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  .original {
    color: var(--muted);
    text-decoration: none;
    font-size: 12px;
    padding: 10px;
  }

  .original:hover { color: var(--ink); }

  main {
    height: calc(100dvh - 58px);
    padding: 15px 20px;
    display: grid;
    place-items: center;
  }

  .player-shell {
    position: relative;
    height: 100%;
    max-height: 812px;
    aspect-ratio: 9 / 16;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: #000;
    box-shadow: 0 28px 90px rgba(0,0,0,.52);
  }

  .player-shell video,
  .instagram-image {
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
    object-fit: contain;
  }

  .instagram-image[hidden], .player-shell video[hidden] { display: none; }

  .instagram-nav {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    pointer-events: none;
  }

  .instagram-nav[hidden] { display: none; }

  .instagram-nav button {
    width: 48px;
    height: 48px;
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px;
    background: rgba(0,0,0,.72);
    color: #fff;
    font: 700 22px/1 var(--sans);
    cursor: pointer;
    pointer-events: auto;
    backdrop-filter: blur(10px);
  }

  .instagram-count {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    min-width: 54px;
    padding: 7px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.72);
    color: #fff;
    font: 700 12px/1 var(--mono);
    text-align: center;
    pointer-events: none;
  }

  .player-state {
    position: absolute;
    inset: 0;
    z-index: 2;
    padding: 28px;
    display: grid;
    place-content: center;
    gap: 16px;
    background: #090909;
    color: var(--muted);
    text-align: center;
    font-size: 13px;
    line-height: 1.45;
  }

  .player-state[hidden] { display: none; }

  .spinner {
    width: 32px;
    height: 32px;
    margin: 0 auto;
    border: 3px solid rgba(255,255,255,.15);
    border-top-color: var(--signal);
    border-radius: 50%;
  }

  .player-state a { color: var(--ink); text-underline-offset: 3px; }

  .prototype-tag {
    position: fixed;
    left: 18px;
    bottom: 16px;
    color: #686862;
    font-size: 10px;
    font-weight: 650;
    letter-spacing: .13em;
    text-transform: uppercase;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    z-index: 3;
    padding: 10px 14px;
    border: 1px solid rgba(216,255,69,.35);
    border-radius: 999px;
    background: #181b10;
    color: var(--ink);
    font-size: 12px;
    transform: translate(-50%, 16px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }

  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 600px) {
    .topbar {
      height: 54px;
      padding: env(safe-area-inset-top) 12px 0;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
    }

    .brand { font-size: 15px; }
    .mark { width: 17px; height: 17px; }
    .source { justify-self: center; }
    .source span, .original { display: none; }
    .action { min-width: 68px; min-height: 36px; padding: 0 12px; }

    main {
      height: calc(100dvh - 54px);
      padding: 0;
      background: #000;
    }

    .player-shell {
      width: 100%;
      height: 100%;
      max-height: none;
      aspect-ratio: auto;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .prototype-tag { display: none; }
    .toast { bottom: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
    .spinner { border-color: var(--signal); }
  }
</style>

  let instagramIndex = 0;

  function normalizeSharedUrl(value) {
    try {
      const candidate = /^https?:\/\//i.test(value) ? value : 'https://' + value;
      const url = new URL(candidate);
      const host = url.hostname.toLowerCase();
      if (host === 'tiktok.com' || host.endsWith('.tiktok.com')) {
        return { platform: 'tiktok', url: url.origin + url.pathname };
      }
      if (host === 'instagram.com' || host.endsWith('.instagram.com') || host === 'instagr.am' || host.endsWith('.instagr.am')) {
        const match = url.pathname.match(/^\/(?:[^/]+\/)?(p|reel|reels|tv)\/([\w-]+)/i);
        if (!match) return null;
        const type = match[1].toLowerCase() === 'reels' ? 'reel' : match[1].toLowerCase();
        const shortcode = match[2];
        return {
          platform: 'instagram',
          url: 'https://www.instagram.com/' + type + '/' + shortcode + '/',
          embed: 'https://www.instagram.com/' + type + '/' + shortcode + '/embed/'
        };
      }
      return null;
    } catch {
      return null;
    }
  }

  function trustedMediaUrl(value) {
    try {
      const url = new URL(value);
      const host = url.hostname.toLowerCase();
      const allowed = [
        'tiktokcdn.com',
        'tiktokcdn-us.com',
        'tiktokcdn-eu.com',
        'muscdn.com',
        'tikwm.com'
      ];
      return url.protocol === 'https:' && allowed.some((domain) => host === domain || host.endsWith('.' + domain));
    } catch {
      return false;
    }
  }

  function trustedInstagramMediaUrl(value) {
    try {
      const url = new URL(value);
      const host = url.hostname.toLowerCase();
      const allowed = ['cdninstagram.com', 'fbcdn.net', 'instagram7.com'];
      return url.protocol === 'https:' && allowed.some((domain) => host === domain || host.endsWith('.' + domain));
    } catch {
      return false;
    }
  }

  function showPlayerState(message, failed = false) {
    playerState.hidden = false;
    playerMessage.textContent = message;
    playerSpinner.hidden = failed;
    playerFallback.hidden = !failed;
  }

  function hidePlayerState() {
    playerState.hidden = true;
  }

  function delay(milliseconds) {
    return new Promise((resolve) => window.setTimeout(resolve, milliseconds));
  }

  async function fetchVideoData(sourceUrl, attempt = 0) {
    const endpoint = 'https://www.tikwm.com/api/?hd=0&url=' + encodeURIComponent(sourceUrl);
    const response = await fetch(endpoint, { headers: { Accept: 'application/json' } });
    if (!response.ok) {
      if (attempt < 2 && (response.status === 429 || response.status >= 500)) {
        await delay(1350);
        return fetchVideoData(sourceUrl, attempt + 1);
      }
      throw new Error('Resolver request failed.');
    }
    const payload = await response.json();
    if (payload.code === 0 && payload.data) return payload.data;
    if (attempt < 2 && /limit|frequent|second/i.test(payload.msg || '')) {
      await delay(1350);
      return fetchVideoData(sourceUrl, attempt + 1);
    }
    throw new Error(payload.msg || 'Video could not be resolved.');
  }

  async function openDynamicVideo(sourceUrl) {
    showPlayerState('Fetching fresh slop…');
    original.href = sourceUrl;
    playerFallback.href = sourceUrl;
    instagramImage.hidden = true;
    instagramNav.hidden = true;
    video.hidden = false;

    try {
      const data = await fetchVideoData(sourceUrl);
      const mediaUrl = data.wmplay || data.play;
      if (!trustedMediaUrl(mediaUrl)) throw new Error('Unexpected media source.');
      if (data.cover && trustedMediaUrl(data.cover)) video.poster = data.cover;
      video.src = mediaUrl;
      video.load();

      const username = data.author && data.author.unique_id ? data.author.unique_id : 'creator';
      creator.textContent = '@' + username;
      shareTitle = 'Watch @' + username;
      document.title = 'SlopStream · @' + username;
      video.setAttribute('aria-label', 'TikTok video by ' + username);

      const ready = () => hidePlayerState();
      video.addEventListener('loadedmetadata', ready, { once: true });
      video.addEventListener('error', () => showPlayerState('This video could not be played.', true), { once: true });
      window.setTimeout(() => {
        if (video.readyState >= 1) hidePlayerState();
      }, 1400);
    } catch {
      showPlayerState('This TikTok link could not be opened.', true);
    }
  }

  async function fetchInstagramData(sourceUrl, attempt = 0) {
    const response = await fetch(instagramResolver + encodeURIComponent(sourceUrl), { headers: { Accept: 'application/json' } });
    if (!response.ok) {
      if (attempt < 1 && (response.status === 429 || response.status >= 500)) {
        await delay(900);
        return fetchInstagramData(sourceUrl, attempt + 1);
      }
      throw new Error('Instagram resolver request failed.');
    }
    const data = await response.json();
    if (!Array.isArray(data.items) || !data.items.length) throw new Error('Instagram media was not found.');
    return data;
  }

  function renderInstagramItem(index) {
    const item = instagramItems[index];
    if (!item || !trustedInstagramMediaUrl(item.url)) {
      showPlayerState('This Instagram item could not be played.', true);
      return;
    }

    instagramIndex = index;
    instagramCount.textContent = `${index + 1} / ${instagramItems.length}`;
    instagramNav.hidden = instagramItems.length < 2;
    video.pause();

    if (item.kind === 'video') {
      instagramImage.hidden = true;
      video.hidden = false;
      video.poster = trustedInstagramMediaUrl(item.poster) ? item.poster : '';
      video.src = item.url;
      video.setAttribute('aria-label', 'Instagram video');
      video.load();
      video.addEventListener('loadedmetadata', hidePlayerState, { once: true });
      video.addEventListener('error', () => showPlayerState('This Instagram video could not be played.', true), { once: true });
      return;
    }

    video.hidden = true;
    video.removeAttribute('src');
    video.load();
    instagramImage.hidden = false;
    instagramImage.onload = hidePlayerState;
    instagramImage.onerror = () => showPlayerState('This Instagram image could not be opened.', true);
    instagramImage.src = item.url;
  }

  async function openInstagramPost(source) {
    showPlayerState('Heating Instagram slop…');
    original.href = source.url;
    playerFallback.href = source.url;
    creator.textContent = '@instagram';
    sourcePlatform.textContent = 'via Instagram';
    shareTitle = 'Watch this Instagram post';
    document.title = 'SlopStream · Instagram';
    instagramImage.hidden = true;
    instagramNav.hidden = true;
    video.pause();
    video.hidden = true;

    try {
      const data = await fetchInstagramData(source.url);
      instagramItems = data.items.filter((item) => trustedInstagramMediaUrl(item.url));
      if (!instagramItems.length) throw new Error('Instagram media source was rejected.');
      creator.textContent = data.creator || '@instagram';
      sourcePlatform.textContent = 'via Instagram';
      shareTitle = 'Watch ' + (data.creator || 'this Instagram post');
      document.title = 'SlopStream · ' + (data.creator || 'Instagram');
      renderInstagramItem(0);
    } catch {
      showPlayerState('This Instagram link could not be opened.', true);
    }
  }

  instagramPrev.addEventListener('click', () => {
    showPlayerState('Heating the previous slice…');
    renderInstagramItem((instagramIndex - 1 + instagramItems.length) % instagramItems.length);
  });

  instagramNext.addEventListener('click', () => {
    showPlayerState('Heating the next slice…');
    renderInstagramItem((instagramIndex + 1) % instagramItems.length);
  });

  const requestedValue = new URLSearchParams(window.location.search).get('url') || '';
  const requestedSource = normalizeSharedUrl(requestedValue);
  if (requestedSource?.platform === 'tiktok') openDynamicVideo(requestedSource.url);
  if (requestedSource?.platform === 'instagram') openInstagramPost(requestedSource);
  if (requestedValue && !requestedSource) {
    video.hidden = true;
    creator.textContent = 'Unsupported link';
    sourcePlatform.textContent = '';
    showPlayerState('Paste a public TikTok or Instagram post link.', true);
    playerFallback.hidden = true;
  }

  shareButton.addEventListener('click', async () => {
    const data = {
      title: shareTitle,
      text: 'Watch this without installing another app.',
      url: window.location.href
    };

    try {
      if (navigator.share) {
        await navigator.share(data);
        return;
      }
      await navigator.clipboard.writeText(window.location.href);
      toast.classList.add('show');
      window.setTimeout(() => toast.classList.remove('show'), 1600);
    } catch (error) {
      if (error && error.name === 'AbortError') return;
      toast.textContent = 'Copy the address from your browser';
      toast.classList.add('show');
      window.setTimeout(() => toast.classList.remove('show'), 2200);
    }
  });
</script>
</body>
</html>
