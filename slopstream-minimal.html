<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090d14" />
  <meta name="description" content="Convert TikTok and Instagram links into clean browser links." />
  <title>SlopStream · Video links with social skills</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: rgb(9 13 20);
      --bg-top: rgb(14 27 49);
      --surface: rgb(17 24 35);
      --input: rgb(8 12 19);
      --line: rgb(42 53 69);
      --ink: rgb(242 245 250);
      --muted: rgb(181 191 206);
      --faint: rgb(130 144 164);
      --blue: rgb(40 118 247);
      --blue-hi: rgb(108 162 255);
      --danger: rgb(226 130 124);
      --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      color: var(--ink);
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 34%, var(--bg) 100%);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    button,
    input { font: inherit; }

    button,
    a { -webkit-tap-highlight-color: transparent; }

    .skip-link {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 5;
      padding: 12px 16px;
      border-radius: 10px;
      color: var(--ink);
      background: var(--blue);
      font-weight: 700;
      text-decoration: none;
      transform: translateY(-160%);
      transition: transform 160ms ease;
    }

    .skip-link:focus { transform: translateY(0); }

    .page {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 620px;
    }

    main {
      width: min(100% - 40px, 704px);
      margin: 0 auto;
      padding-top: clamp(72px, 10.4vh, 94px);
      text-align: center;
    }

    .brand {
      width: 80px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      font-size: 32px;
      font-weight: 750;
      line-height: 1;
      letter-spacing: -0.04em;
      text-decoration: none;
    }

    .brand-mark {
      width: 80px;
      height: 80px;
      display: block;
      border-radius: 19px;
      filter: drop-shadow(0 16px 28px rgb(0 0 0 / 0.18));
    }

    h1 {
      margin: 17px auto 0;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: clamp(62px, 6.56vw, 94.4px);
      font-weight: 400;
      line-height: 0.94;
      letter-spacing: -0.052em;
    }

    h1 span { display: block; }

    .support {
      margin-top: 26px;
      display: grid;
      gap: 12px;
      color: var(--muted);
      font-size: 18.4px;
      font-weight: 550;
      line-height: 1.65;
    }

    .support p { margin: 0; }

    .converter {
      position: relative;
      width: 100%;
      min-height: 166px;
      margin-top: 28px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
    }

    form,
    .ready {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px 8px;
    }

    .field {
      min-width: 0;
      height: 64px;
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      align-items: center;
      padding-left: 14px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--input);
    }

    .link-icon {
      width: 22px;
      height: 22px;
      color: var(--faint);
    }

    label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    input {
      min-width: 0;
      height: 60px;
      padding: 0 12px 0 0;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: 0;
      font-size: 16px;
    }

    input::placeholder { color: var(--faint); opacity: 1; }

    .field:focus-within {
      border-color: var(--blue-hi);
      box-shadow: 0 0 0 3px rgb(40 118 247 / 0.15);
    }

    .field[data-invalid="true"] {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgb(226 130 124 / 0.12);
    }

    button,
    .button-link {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 10px;
      color: var(--blue-hi);
      background: transparent;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
    }

    button:focus-visible,
    .button-link:focus-visible,
    .brand:focus-visible,
    .footer-link:focus-visible {
      outline: 2px solid var(--blue-hi);
      outline-offset: 3px;
    }

    .paste {
      width: 56px;
      height: 64px;
      font-size: 13px;
    }

    .paste:hover { color: var(--ink); }

    .primary {
      grid-column: 1 / -1;
      width: 100%;
      height: 56px;
      border-radius: 14px;
      color: rgb(7 16 29);
      background: var(--blue);
      font-size: 15px;
      font-weight: 780;
    }

    .primary:hover { background: var(--blue-hi); }

    .status {
      position: absolute;
      top: calc(100% + 8px);
      left: 16px;
      right: 16px;
      margin: 0;
      color: var(--danger);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .ready[hidden],
    form[hidden],
    .status:empty { display: none; }

    .ready-copy {
      min-width: 0;
      height: 64px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--input);
      text-align: left;
    }

    .ready-copy strong {
      color: var(--ink);
      font-size: 14px;
    }

    .clean-url {
      overflow: hidden;
      color: var(--faint);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .share {
      width: 64px;
      height: 64px;
      font-size: 13px;
    }

    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer-link {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      color: var(--faint);
      font-size: 12px;
      font-weight: 650;
      text-underline-offset: 3px;
    }

    .footer-link:hover { color: var(--muted); }

    @media (max-width: 640px) {
      main {
        width: min(100% - 64px, 326px);
        padding-top: clamp(88px, 19.7vh, 166px);
      }

      h1 {
        margin-top: 14px;
        font-size: 50.7px;
        line-height: 0.98;
        letter-spacing: -0.052em;
      }

      .support {
        margin-top: 15px;
        gap: 10px;
        font-size: 16px;
        line-height: 1.5;
      }

      .converter { margin-top: 25px; }
    }

    @media (max-height: 720px) {
      main { padding-top: 44px; }
      .brand-mark { width: 64px; height: 64px; border-radius: 16px; }
      .brand { width: 64px; gap: 7px; font-size: 27px; }
      h1 { margin-top: 12px; font-size: 44px; }
      .support { margin-top: 12px; gap: 6px; }
      .converter { margin-top: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#converter">Skip to converter</a>

  <div class="page">
    <main>
      <a class="brand" href="https://thinkpool-io.github.io/mockups/slopstream-minimal.html" aria-label="SlopStream home">
        <svg class="brand-mark" viewBox="0 0 80 80" role="img" aria-label="SlopStream">
          <rect x="0.5" y="0.5" width="79" height="79" rx="18.5" fill="#0d1b31" stroke="#2876f7" />
          <circle cx="40" cy="40" r="22" fill="none" stroke="#6ca2ff" stroke-width="2" />
          <path d="M24 42c5.5-7 11-10.5 16-10.5S50.5 35 56 42c-5.5 7-11 10.5-16 10.5S29.5 49 24 42Z" fill="none" stroke="#2876f7" stroke-width="2.4" stroke-linejoin="round" />
          <circle cx="40" cy="42" r="3.5" fill="#f2f5fa" />
        </svg>
        <span>SlopStream</span>
      </a>

      <h1><span>Video links</span><span>with social skills</span></h1>

      <div class="support">
        <p>Start with TikTok or Instagram</p>
        <p>SlopStream opens it in your browser</p>
      </div>

      <section class="converter" id="converter" aria-label="Convert a video link">
        <form id="relay-form" novalidate>
          <div class="field" id="field">
            <svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9.8 13.8 14.2 9.4a3 3 0 0 0-4.2-4.2L4.3 10.9a5 5 0 0 0 7.1 7.1l6.1-6.1a7 7 0 0 0-9.9-9.9L2.8 6.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <label for="source-url">TikTok or Instagram link</label>
            <input id="source-url" name="url" type="url" inputmode="url" autocomplete="url" placeholder="Add a video link…" aria-describedby="status" required />
          </div>
          <button class="paste" id="paste-button" type="button">Paste</button>
          <button class="primary" type="submit">Convert</button>
        </form>

        <div class="ready" id="ready" hidden>
          <div class="ready-copy">
            <strong>Clean link ready</strong>
            <span class="clean-url" id="clean-url"></span>
          </div>
          <button class="share" id="share-link" type="button">Share</button>
          <a class="button-link primary" id="open-link" href="#" target="_blank" rel="noopener noreferrer">Open link</a>
        </div>

        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <footer>
      <a class="footer-link" href="https://thinkpool-io.github.io/mockups/slopstream/ShareWithSlopStream.shortcut">iPhone Shortcut</a>
    </footer>
  </div>

  <script>
    const viewerBase = 'https://thinkpool-io.github.io/mockups/tokless-prototype.html';
    const form = document.querySelector('#relay-form');
    const field = document.querySelector('#field');
    const input = document.querySelector('#source-url');
    const status = document.querySelector('#status');
    const ready = document.querySelector('#ready');
    const cleanUrl = document.querySelector('#clean-url');
    const openLink = document.querySelector('#open-link');
    const shareLink = document.querySelector('#share-link');
    let generatedLink = '';

    function normalizeSource(value) {
      try {
        const candidate = /^https?:\/\//i.test(value) ? value : 'https://' + value;
        const url = new URL(candidate);
        const host = url.hostname.toLowerCase();
        if (host === 'tiktok.com' || host.endsWith('.tiktok.com')) {
          return url.origin + url.pathname;
        }
        if (host === 'instagram.com' || host.endsWith('.instagram.com') || host === 'instagr.am' || host.endsWith('.instagr.am')) {
          const match = url.pathname.match(/^\/(?:[^/]+\/)?(?:p|reel|reels|tv)\/[\w-]+/i);
          if (!match) return null;
          return url.origin + match[0].replace(/^\/reels\//i, '/reel/') + '/';
        }
        return null;
      } catch {
        return null;
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const source = normalizeSource(input.value.trim());
      if (!source) {
        field.dataset.invalid = 'true';
        status.textContent = 'Enter a public TikTok or Instagram link.';
        input.focus();
        return;
      }

      field.removeAttribute('data-invalid');
      status.textContent = '';
      generatedLink = viewerBase + '?url=' + encodeURIComponent(source);
      cleanUrl.textContent = generatedLink;
      openLink.href = generatedLink;
      form.hidden = true;
      ready.hidden = false;
    });

    document.querySelector('#paste-button').addEventListener('click', async () => {
      try {
        input.value = await navigator.clipboard.readText();
        input.focus();
      } catch {
        input.focus();
        status.textContent = 'Press and hold the field to paste.';
      }
    });

    shareLink.addEventListener('click', async () => {
      if (!generatedLink) return;
      try {
        if (navigator.share) {
          await navigator.share({ title: 'SlopStream', text: 'Open this video in your browser.', url: generatedLink });
          return;
        }
        await navigator.clipboard.writeText(generatedLink);
        shareLink.textContent = 'Copied';
        window.setTimeout(() => { shareLink.textContent = 'Share'; }, 1400);
      } catch (error) {
        if (error && error.name === 'AbortError') return;
        shareLink.textContent = 'Copy';
      }
    });
  </script>
</body>
</html>
