<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lynx · Share universal link</title>
  <style>
    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: #080d14;
    }

    body {
      min-height: 100dvh;
      margin: 0;
      background:
        radial-gradient(circle at 50% -110px, rgba(37, 91, 177, .25), transparent 410px),
        #080d14;
      color: #f3f6fc;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    a { font: inherit; }

    .lynx-page {
      display: flex;
      width: min(100%, 680px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: 48px 28px 18px;
      flex-direction: column;
    }

    .lynx-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
      font-size: 32px;
      font-weight: 760;
      letter-spacing: -.035em;
      line-height: 1;
    }

    .lynx-brand img {
      width: 80px;
      height: 80px;
      border-radius: 20px;
    }

    .lynx-result {
      border: 1px solid #30394a;
      border-radius: 23px;
      background: rgba(18, 25, 37, .96);
      box-shadow: 0 24px 64px rgba(0, 0, 0, .24);
      padding: 22px;
    }

    .lynx-track {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
    }

    .lynx-cover {
      display: block;
      width: 88px;
      height: 88px;
      border-radius: 18px;
      background: #253047;
      object-fit: cover;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1);
    }

    .lynx-track h1 {
      margin: 0 0 5px;
      font-size: 27px;
      font-weight: 760;
      line-height: 1.08;
      letter-spacing: -.035em;
    }

    .lynx-track p {
      margin: 0;
      color: #9ca8bb;
      font-size: 18px;
    }

    .lynx-destinations {
      display: grid;
      gap: 10px;
    }

    .lynx-destination {
      display: grid;
      min-height: 68px;
      grid-template-columns: minmax(0, 1fr) 44px;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      border: 1px solid #30394a;
      border-radius: 15px;
      background: #0a111b;
      padding: 0 12px 0 0;
    }

    .lynx-destination-main {
      display: grid;
      min-height: 66px;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 11px 0 11px 15px;
      color: #f3f6fc;
      text-decoration: none;
    }

    .lynx-service-icon {
      display: block;
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .lynx-service-icon.spotify { padding: 1px; }

    .lynx-service-name {
      min-width: 0;
      overflow: hidden;
      font-size: 20px;
      font-weight: 760;
      letter-spacing: -.025em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lynx-match-state {
      color: #72c69b;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 760;
      letter-spacing: .04em;
      white-space: nowrap;
    }

    .lynx-match-state.original { color: #70a6ff; }

    .lynx-copy-service {
      display: grid;
      width: 42px;
      height: 42px;
      padding: 0;
      place-items: center;
      border: 1px solid #445065;
      border-radius: 11px;
      background: #121a27;
      color: #dbe8ff;
    }

    .lynx-copy-service svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .lynx-share-universal {
      display: grid;
      width: 100%;
      min-height: 64px;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      border: 1px solid #2f7cf6;
      border-radius: 16px;
      background: #2f7cf6;
      color: #07101e;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.01em;
    }

    .lynx-share-universal svg {
      width: 23px;
      height: 23px;
      justify-self: end;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .lynx-share-universal::after {
      width: 23px;
      height: 1px;
      content: "";
    }

    .lynx-convert-another {
      display: block;
      width: max-content;
      margin: 22px auto 3px;
      color: #aab5c6;
      font-size: 15px;
      font-weight: 680;
      text-decoration: none;
    }

    .lynx-footer {
      display: flex;
      min-height: 94px;
      align-items: flex-end;
      justify-content: center;
      margin-top: auto;
      padding: 28px 0 6px;
    }

    .lynx-footer a {
      color: #8995a9;
      font-size: 13px;
      font-weight: 650;
      text-underline-offset: 4px;
    }

    .lynx-destination:hover,
    .lynx-destination:focus-within {
      border-color: #70a6ff;
    }

    .lynx-share-universal:hover,
    .lynx-share-universal:focus-visible {
      background: #448afa;
      outline: 3px solid rgba(108, 162, 255, .45);
      outline-offset: 2px;
    }

    @media (max-width: 560px) {
      .lynx-page {
        width: 100%;
        padding: 36px 18px 10px;
      }

      .lynx-brand {
        gap: 9px;
        margin-bottom: 22px;
        font-size: 29px;
      }

      .lynx-brand img {
        width: 68px;
        height: 68px;
        border-radius: 18px;
      }

      .lynx-result {
        border-radius: 20px;
        padding: 16px;
      }

      .lynx-track {
        grid-template-columns: 76px minmax(0, 1fr);
        gap: 14px;
        margin-bottom: 18px;
      }

      .lynx-cover {
        width: 76px;
        height: 76px;
        border-radius: 15px;
      }

      .lynx-track h1 { font-size: 23px; }
      .lynx-track p { font-size: 16px; }

      .lynx-destination {
        min-height: 62px;
        grid-template-columns: minmax(0, 1fr) 36px;
        gap: 6px;
        border-radius: 14px;
        padding-right: 9px;
      }

      .lynx-destination-main {
        min-height: 60px;
        grid-template-columns: 36px minmax(0, 1fr) auto;
        gap: 8px;
        padding: 9px 0 9px 9px;
      }

      .lynx-service-icon {
        width: 34px;
        height: 34px;
      }

      .lynx-service-name { font-size: 16px; }
      .lynx-match-state { font-size: 10px; }

      .lynx-copy-service {
        width: 36px;
        height: 38px;
        border-radius: 10px;
      }

      .lynx-copy-service svg {
        width: 17px;
        height: 17px;
      }

      .lynx-share-universal {
        min-height: 58px;
        margin-top: 17px;
        border-radius: 15px;
        font-size: 17px;
      }

      .lynx-footer { min-height: 100px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
